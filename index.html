<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Support AI Interview Chatbot</title>
  <style>
    :root {
      --bg: #07090e;
      --panel: #0d1322;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --accent: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top App Navigation */
    header {
      background: rgba(13, 19, 34, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #07090e;
      font-size: 0.9rem;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid var(--border);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .btn:hover {
      color: #fff;
      border-color: var(--primary);
    }

    .btn-mic {
      background: var(--danger);
      color: #fff;
      border: none;
    }

    .btn-mic.active {
      background: #0284c7;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.5);
    }

    /* Quick Starter Suggestion Chips */
    .starter-strip {
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--border);
      padding: 6px 16px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .starter-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .starter-chip:hover {
      background: var(--primary);
      color: #07090e;
      border-color: var(--primary);
    }

    /* Chat Area */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-container::-webkit-scrollbar {
      width: 6px;
    }
    .chat-container::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    /* User Message Bubble */
    .msg-user {
      align-self: flex-end;
      max-width: 80%;
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      border-radius: 12px 12px 2px 12px;
      padding: 10px 14px;
      font-size: 0.92rem;
      color: #fff;
      font-weight: 600;
    }

    /* Bot Structured 4-Part Response Card */
    .msg-bot {
      align-self: flex-start;
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 1.5px solid rgba(99, 102, 241, 0.35);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .meta-tag {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .btn-copy {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.78rem;
    }
    .btn-copy:hover { color: var(--primary); }

    /* Part 1: Opener */
    .sec-opener {
      background: rgba(245, 158, 11, 0.12);
      border-left: 3px solid var(--warning);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.88rem;
      color: #fde68a;
      line-height: 1.45;
    }

    /* Part 2: Bullets */
    .sec-bullets-title {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      font-weight: 800;
      margin-bottom: 4px;
    }

    .sec-bullets {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sec-bullets li {
      font-size: 0.95rem;
      color: #f1f5f9;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .sec-bullets li::before {
      content: "▶";
      color: var(--accent);
      font-size: 0.75rem;
      margin-top: 3px;
    }

    /* Part 3: Spoken Script */
    .sec-script-box {
      background: #090e18;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .sec-script-title {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 800;
      color: #a5b4fc;
      margin-bottom: 6px;
    }

    .sec-script-text {
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.6;
      font-style: italic;
    }

    /* Part 4: Commands */
    .sec-commands {
      background: #04060a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.84rem;
      color: #67e8f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Bottom Input Area */
    .input-bar {
      background: rgba(13, 19, 34, 0.98);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    #chatInput {
      flex: 1;
      background: #090d16;
      border: 1.5px solid #334155;
      color: #fff;
      padding: 11px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #chatInput:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    }

    .btn-send {
      background: var(--primary);
      color: #07090e;
      border: none;
      font-weight: 800;
      padding: 11px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-send:hover { background: #7dd3fc; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-badge">⚡</div>
      <span class="brand-title">Application Support Copilot</span>
    </div>

    <div class="header-actions">
      <button class="btn btn-mic" id="micBtn" onclick="toggleMic()">🎙️ Listen HR</button>
      <button class="btn" onclick="clearChat()">🗑️ Clear</button>
    </div>
  </header>

  <!-- Quick Starter Topic Chips -->
  <div class="starter-strip">
    <span style="font-size: 0.72rem; color: #64748b; line-height: 22px;">Try:</span>
    <div class="starter-chip" onclick="submitQuickQuestion('Tell me about yourself')">Tell me about yourself</div>
    <div class="starter-chip" onclick="submitQuickQuestion('How do you troubleshoot application slowness?')">App Slowness</div>
    <div class="starter-chip" onclick="submitQuickQuestion('How do you troubleshoot high CPU on Linux?')">High CPU</div>
    <div class="starter-chip" onclick="submitQuickQuestion('How do you investigate production application logs?')">Logs & Grep</div>
    <div class="starter-chip" onclick="submitQuickQuestion('How do you resolve database deadlocks and session blockages?')">DB Locks</div>
    <div class="starter-chip" onclick="submitQuickQuestion('How do you handle a P1 major incident?')">P1 Major Incident</div>
    <div class="starter-chip" onclick="submitQuickQuestion('How do you fix HTTP 502 and 504 status codes?')">HTTP 502/504</div>
    <div class="starter-chip" onclick="submitQuickQuestion('How do you troubleshoot a 100% full filesystem?')">Disk 100% Full</div>
    <div class="starter-chip" onclick="submitQuickQuestion('What is your biggest weakness?')">Weakness</div>
  </div>

  <!-- Chat History Container -->
  <div class="chat-container" id="chatBox"></div>

  <!-- Bottom Message Input Form -->
  <form class="input-bar" onsubmit="handleChatSubmit(event)">
    <input 
      type="text" 
      id="chatInput" 
      placeholder="Type HR question or turn on mic (e.g. 'What is SLA vs OLA?', 'How to debug OOM?')..." 
      autocomplete="off"
    />
    <button type="submit" class="btn-send">Generate Answer</button>
  </form>

  <script>
    // COMPLETE KNOWLEDGE BASE FOR APPLICATION SUPPORT (L1/L2)
    const KNOWLEDGE_BASE = [
      {
        triggers: ["tell me about yourself", "introduce yourself", "walk me through", "background", "experience", "profile"],
        category: "Introduction & Profile",
        opener: "Thank you for the opportunity. I specialize in L1 and L2 Application Production Support, focusing on system uptime, rapid incident resolution, and high availability across distributed environments.",
        bullets: [
          "Operational Scope: Triage tickets in ServiceNow/Jira, monitor production telemetry, execute health checks, and uphold strict SLAs.",
          "Technical Foundation: Linux command line, Oracle/PostgreSQL SQL queries, Java/Tomcat web servers, and bash automation.",
          "Engineering Focus: Deliver rapid temporary workarounds to stop business downtime, followed by root-cause analysis (RCA) with dev teams."
        ],
        script: "My experience centers on L1 and L2 Application Production Support. On a daily basis, I monitor application health, handle inbound incidents through our ticketing system, and perform environment sanity checks during shift handovers. Technically, I work extensively on Linux servers analyzing logs, verifying process states, and troubleshooting system bottlenecks. I write SQL queries to validate data integrity, troubleshoot connection pools, and assist with application deployments during maintenance windows. When critical issues occur, I coordinate with development and infrastructure teams to restore service quickly and document the post-incident root cause.",
        commands: "top | ps -ef | tail -100f app.log | df -h | netstat -tulnp"
      },
      {
        triggers: ["slow", "slowness", "application slow", "performance issue", "latency"],
        category: "Performance Troubleshooting",
        opener: "Whenever application slowness is reported, my approach is to systematically isolate whether the bottleneck is at the client network, server OS, JVM thread pool, or database layer.",
        bullets: [
          "Blast Radius: Confirm whether slowness impacts a single user (browser cache/VPN) or all users globally.",
          "Host Resource Check: Run 'top', 'uptime', and 'vmstat' to check Load Average, CPU saturation, and memory swapping.",
          "App Server / Threading: Inspect Tomcat catalina logs, thread pool saturation (maxThreads reached), and GC pauses.",
          "Database Contention: Check active database sessions for uncommitted transactions holding row-level locks."
        ],
        script: "First, I check the scope: if only one user is affected, I verify their network connectivity, VPN, and browser cache. If it affects everyone, I log into the Linux host and run top and vmstat to verify CPU load, memory utilization, and swap activity. Next, I inspect the application layer to verify whether active threads have hit the ceiling or if Garbage Collection is stalling the application. At the database layer, I check for blocking sessions or uncommitted transactions holding row locks. Once the bottleneck is isolated, I terminate runaway locks or restart the degraded instance, and then hand over logs to development for root cause analysis.",
        commands: "top -b -n 1 | vmstat 1 5 | iostat -xz 1 5 | v$session"
      },
      {
        triggers: ["cpu", "memory", "load average", "high cpu", "swap", "ram"],
        category: "Linux Server Diagnostics",
        opener: "When server resources spike, I immediately isolate whether the bottleneck is process-bound, stuck on disk I/O wait, or caused by memory swapping.",
        bullets: [
          "CPU Triage: Run 'top' or 'uptime' to check Load Average. Press 'P' to sort by CPU; run 'ps aux --sort=-%cpu | head -10' to isolate the rogue PID.",
          "Memory & Swap: Run 'free -m' and 'vmstat 1 5' to check 'si' (swap in) and 'so' (swap out). Active swap I/O indicates physical RAM exhaustion.",
          "Remediation: If Java, capture thread dumps (jstack) before terminating; terminate cleanly with 'kill -15', or 'kill -9' if completely hung."
        ],
        script: "I start by running top to check the system load average. If load average is significantly higher than the number of CPU cores, the system is bottlenecked. I look at the %wa metric: if I/O wait is high, the CPU is waiting on slow disk or network calls. If user CPU is high, I press Shift+P in top or run ps aux --sort=-%cpu | head -10 to find the exact Process ID consuming the cycles. For memory issues, I run free -h and vmstat 1 5 to verify swapping. If the process is Java, I take a quick thread dump using jstack before recycling the service so engineering can identify the runaway thread.",
        commands: "top | ps aux --sort=-%cpu | head -10 | free -m | vmstat 1 5 | jstack <pid>"
      },
      {
        triggers: ["log", "logs", "grep", "tail", "exception", "catalina", "trace", "investigate log"],
        category: "Log Analysis Masterclass",
        opener: "Log analysis is my primary diagnostic tool. I use real-time tailing, contextual grep searching, and compressed log utilities to trace root causes.",
        bullets: [
          "Live Monitoring: Run 'tail -100f app.log | grep -iE \"ERROR|FATAL|Exception\"' to monitor incoming production failures.",
          "Context Search: Use 'grep -i -C 5 \"NullPointer\" app.log' to extract 5 lines before and after the crash to inspect stack traces.",
          "Compressed Archives: Use 'zgrep', 'zcat', or 'zless' to search archived .gz logs without decompressing them to disk."
        ],
        script: "In production support, I treat logs as the single source of truth. I start by running tail -f on the catalina or application error log piped through a grep filter for errors and exceptions. When an error is spotted, I run grep with -C 5 to capture context lines above and below the error, revealing the originating class and line number. For historical investigations across rotated logs, I use zgrep directly on the compressed .gz archives so I don't waste disk space by extracting them.",
        commands: "tail -100f app.log | grep -i -C 5 'Exception' | zgrep -i 'timeout' *.gz"
      },
      {
        triggers: ["disk", "space", "filesystem", "100%", "75%", "df", "du", "truncate", "lsof"],
        category: "Filesystem & Disk Management",
        opener: "When a filesystem saturates, I identify heavy files, handle open file descriptors safely, and truncate without killing active processes.",
        bullets: [
          "Locate Mount: Run 'df -h' to identify the saturated volume. Enter directory and run 'du -sk * | sort -k 1nr | head -10'.",
          "Identify Heaviest Files: Run 'ls -lS' to find large target logs. Gzip inactive archive files.",
          "The lsof Trap: If a deleted file still consumes space, check 'lsof | grep deleted'. Truncate active logs with 'cat /dev/null > file.log'."
        ],
        script: "I first run df -h to determine which mount point has saturated. Next, I navigate to that directory and run du -sh * | sort -hr | head -10 to pinpoint the largest subdirectory, followed by ls -lS to identify the biggest files. If a log is actively open by a running Tomcat or Java process, deleting it with 'rm' will not free disk space because the operating system holds the open file handle. Instead, I safely truncate it using 'cat /dev/null > logfile.log'. If space was deleted but not freed, I run 'lsof | grep deleted' to identify the process holding the inode and reload the process.",
        commands: "df -h; du -sh * | sort -hr | head -10; lsof | grep deleted; > app.log"
      },
      {
        triggers: ["lock", "locks", "deadlock", "deadlocks", "blockage", "blocking session", "v$session", "kill session"],
        category: "Database Concurrency & Locks",
        opener: "Database session blockages happen when an uncommitted transaction locks rows needed by concurrent requests, queuing downstream transactions.",
        bullets: [
          "Detection: In Oracle, query 'v$session' where blocking_session is not null. In PostgreSQL, query 'pg_stat_activity' for wait_event_type = 'Lock'.",
          "Triage: Identify the root holding session SID, query details, username, and duration in seconds.",
          "Resolution: Contact the holding user or coordinate with DBA to terminate the holding session using ALTER SYSTEM KILL SESSION."
        ],
        script: "Database blockages occur when a transaction executes an UPDATE or DELETE without issuing a COMMIT or ROLLBACK. This locks table rows and forces subsequent queries into a wait state. I detect this by querying v$session in Oracle for non-null blocking_session records, identifying the root parent SID. Once identified, I confirm whether the session is orphaned or frozen, coordinate with the DBA or user, and execute alter system kill session immediate to clear the backlog and resume transaction processing.",
        commands: "SELECT * FROM v$session WHERE blocking_session IS NOT NULL; ALTER SYSTEM KILL SESSION ('sid,serial#') IMMEDIATE;"
      },
      {
        triggers: ["p1", "p2", "major incident", "critical", "bridge call", "war room", "severity", "priority"],
        category: "Major Incident Management",
        opener: "During a P1 major incident, my priority is rapid triage, clear stakeholder communication, and establishing an immediate workaround before root-cause analysis.",
        bullets: [
          "Phase 1 (Triage & Alert): Verify business impact, raise P1 in ServiceNow, and dispatch Incident Notification email within 15 minutes.",
          "Phase 2 (War Room Bridge): Host bridge call with Incident Manager, DBAs, Network, and Dev leads.",
          "Phase 3 (Restore First): Implement temporary workaround (service restart, DR failover, rollback release) to recover service.",
          "Phase 4 (Problem Handover): Facilitate Post-Incident Review (PIR) and Root Cause Analysis (RCA) with engineering."
        ],
        script: "The moment a P1 is confirmed, I notify leadership and dispatch an initial Incident Notification email containing the issue description, impacted systems, priority, and the next update time. On the technical bridge call, I align teams including DBAs, network engineers, and developers. I keep the focus strictly on service restoration rather than prolonged root cause debate. If rolling back a recent deployment or restarting degraded nodes restores business, we take that action first. I send updates every 30 minutes until resolution, confirm stability with users, and trigger the Problem ticket for the post-mortem.",
        commands: "P1 SLA = 5h | Update Every 30m | Priority = Impact + Urgency"
      },
      {
        triggers: ["500", "502", "503", "504", "bad gateway", "gateway timeout", "http errors", "status code"],
        category: "HTTP 5xx Server Errors",
        opener: "HTTP 5xx status codes indicate server-side failures. I isolate between backend code crashes, reverse proxy breaks, and upstream connection timeouts.",
        bullets: [
          "500 Internal Error: Unhandled backend code exception or database connectivity drop. Check application/catalina logs.",
          "502 Bad Gateway: Upstream backend service is down, crashed, or not listening on its port (Nginx cannot reach Tomcat).",
          "503 Service Unavailable: Server overloaded, thread pool exhausted, or app is under maintenance.",
          "504 Gateway Timeout: Upstream application took longer to respond than the proxy threshold (e.g. slow database query)."
        ],
        script: "For a 500 error, I immediately inspect catalina.out to catch unhandled runtime exceptions or database pool connection drops. For a 502 Bad Gateway, the reverse proxy cannot connect to the backend daemon, so I verify that Tomcat is running using ps -ef and listening on its port with netstat. For a 504 Gateway Timeout, the proxy gave up waiting for the backend, which almost always points to an expensive database query or an unresponsive third-party API. I trace the request ID across the access and application logs to pinpoint the delay.",
        commands: "curl -Iv https://app.com | ps -ef | grep tomcat | netstat -tulnp"
      },
      {
        triggers: ["oom", "outofmemory", "heap", "heap dump", "garbage collection", "jvm", "jstack", "jmap"],
        category: "JVM & Memory Management",
        opener: "When a JVM hits OutOfMemoryError, I identify whether it is Heap Space, Metaspace, or GC Overhead Limit Exceeded before extracting memory dumps.",
        bullets: [
          "Types of OOM: Java Heap Space (object memory leak), Metaspace (classloader leak), GC Overhead limit (98%+ time spent in GC).",
          "Dump Extraction: Configure '-XX:+HeapDumpOnOutOfMemoryError' or extract manually using 'jmap -dump:format=b,file=heap.hprof <pid>'.",
          "Analysis: Analyze the .hprof file using Eclipse Memory Analyzer (MAT) to identify memory leaks and dominator trees."
        ],
        script: "When an application crashes with OutOfMemoryError, simply restarting it is only a temporary fix. I check the exact error message: if it says Java Heap Space, it means memory allocation exceeded the maximum heap (-Xmx) due to a memory leak. I verify whether automated heap dump generation is enabled with -XX:+HeapDumpOnOutOfMemoryError, or manually generate one using jmap. Then I restart the service to recover production, and feed the heap dump into Eclipse Memory Analyzer (MAT) to find the leaking objects for development to patch.",
        commands: "jmap -dump:format=b,file=heap.hprof <PID> | jstack <PID> > threads.txt"
      },
      {
        triggers: ["sla", "ola", "service level agreement", "operational level agreement"],
        category: "ITIL Service Agreements",
        opener: "SLA governs our contractual commitment to business users, whereas OLA defines our internal operational agreements between technical teams.",
        bullets: [
          "SLA (Service Level Agreement): Contract between the IT service provider and the customer defining response and resolution times.",
          "OLA (Operational Level Agreement): Internal agreement between internal teams (Support, DBA, Network, Dev) to support the SLA.",
          "Priority SLAs: Standard enterprise benchmarks are P1 (5 Hours), P2 (10 Hours), P3 (24 Hours), and P4 (48 Hours)."
        ],
        script: "A Service Level Agreement (SLA) is the formal contract between our support organization and the end business users, specifying measurable targets like uptime and resolution timelines—for instance, 5 hours for P1 and 24 hours for P3. An Operational Level Agreement (OLA) is an internal operational agreement between our internal teams—such as how quickly the DBA or Network team must respond when L2 support escalates an issue—ensuring we do not breach the customer-facing SLA.",
        commands: "P1: 5h | P2: 10h | P3: 24h | P4: 48h | MTTR Metrics"
      },
      {
        triggers: ["weakness", "areas of improvement", "struggle with", "greatest weakness"],
        category: "HR Behavioral",
        opener: "I consider self-awareness the foundation of professional growth, and early on my main challenge was hesitating to ask for help when blocked.",
        bullets: [
          "The Weakness: Tendency to spend too much time trying to solve difficult technical roadblocks alone.",
          "The Fix: Implemented a strict '30-Minute Rule'—research independently first, then escalate with findings.",
          "The Result: Faster issue resolution without risking SLA breaches or wasting team resources."
        ],
        script: "Earlier in my career, I had a tendency to spend too much time trying to figure out complex technical problems completely on my own because I wanted to be self-reliant. In production support, where SLAs are critical, waiting too long can create unnecessary risk. I recognized this and adopted a strict 30-minute rule: if I cannot make measurable progress on an issue within 30 minutes of checking logs and runbooks, I organize my findings, summarize what I tested, and consult a senior engineer. This ensures we resolve issues within SLA while keeping collaboration high.",
        commands: "Behavioral: 30-Minute Rule | Structured Escalation | SLA Awareness"
      }
    ];

    // Fallback generator for ANY unknown question
    function generateFallbackAnswer(userQuery) {
      const q = userQuery.toLowerCase();
      return {
        category: "Application Support (Tailored Triage)",
        opener: `Whenever handling an issue regarding ${userQuery}, my approach is to isolate the scope, inspect telemetry and logs, and apply a verified workaround before root-cause investigation.`,
        bullets: [
          `Scope & Blast Radius: Verify whether this impacts single or multiple users, and check current SLA constraints.`,
          `Diagnostic Step: Check relevant Linux server logs, service status, and backend database dependencies.`,
          `Remediation & Closure: Apply a safe workaround or restart, verify health checks, and document the root cause for engineering.`
        ],
        script: `When investigating an issue related to ${userQuery}, I begin by assessing user impact and checking our monitoring dashboards. Next, I connect to the server environment, inspect application access and error logs to catch active exceptions, and verify that all dependent database and network connections are responsive. If production is degraded, I prioritize service restoration using our documented runbooks, confirm stability with business users, and log a problem ticket with logs attached for root-cause analysis.`,
        commands: "ps -ef | tail -100f app.log | ss -tulnp | df -h"
      };
    }

    // Match query against knowledge base or fallback
    function findBestAnswer(query) {
      const q = query.toLowerCase().trim();
      for (const item of KNOWLEDGE_BASE) {
        if (item.triggers.some(t => q.includes(t) || t.includes(q))) {
          return item;
        }
      }
      return generateFallbackAnswer(query);
    }

    // Render Answer Bubble
    function renderBotResponse(answerData, userQuestion) {
      const chatBox = document.getElementById("chatBox");

      // User Bubble
      const userBubble = document.createElement("div");
      userBubble.className = "msg-user";
      userBubble.innerText = userQuestion;
      chatBox.appendChild(userBubble);

      // Bot Card
      const botCard = document.createElement("div");
      botCard.className = "msg-bot";

      const bulletsHtml = answerData.bullets.map(b => `<li>${b}</li>`).join("");

      botCard.innerHTML = `
        <div class="card-meta">
          <span class="meta-tag">⚡ ${answerData.category}</span>
          <button class="btn-copy" onclick="copyCard(this)">📋 Copy Script</button>
        </div>

        <div class="sec-opener">
          <strong>💬 2-Second Opener:</strong> "${answerData.opener}"
        </div>

        <div>
          <div class="sec-bullets-title">📌 Key Bullet Points (Glance & Speak)</div>
          <ul class="sec-bullets">
            ${bulletsHtml}
          </ul>
        </div>

        <div class="sec-script-box">
          <div class="sec-script-title">🗣️ Complete Spoken Script (Say This to HR)</div>
          <div class="sec-script-text">"${answerData.script}"</div>
        </div>

        <div class="sec-commands">
          <span>⚙️ Commands / Tools:</span>
          <strong>${answerData.commands}</strong>
        </div>
      `;

      chatBox.appendChild(botCard);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Chat submit handler
    function handleChatSubmit(e) {
      if (e) e.preventDefault();
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) return;

      const answer = findBestAnswer(text);
      renderBotResponse(answer, text);
      input.value = "";
    }

    function submitQuickQuestion(qText) {
      const answer = findBestAnswer(qText);
      renderBotResponse(answer, qText);
    }

    function clearChat() {
      document.getElementById("chatBox").innerHTML = "";
    }

    function copyCard(btn) {
      const card = btn.closest(".msg-bot");
      const scriptText = card.querySelector(".sec-script-text").innerText;
      navigator.clipboard.writeText(scriptText);
      btn.innerText = "✓ Copied!";
      setTimeout(() => btn.innerText = "📋 Copy Script", 1600);
    }

    // Speech Recognition (Mic Mode)
    let recognition = null;
    let isListening = false;

    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition requires Google Chrome or Microsoft Edge.");
        return null;
      }

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = false;
      rec.lang = "en-US";

      rec.onresult = (evt) => {
        const transcript = evt.results[evt.results.length - 1][0].transcript.trim();
        if (transcript.length > 2) {
          const answer = findBestAnswer(transcript);
          renderBotResponse(answer, transcript);
        }
      };

      rec.onend = () => {
        if (isListening) {
          try { rec.start(); } catch(e) {}
        }
      };

      return rec;
    }

    function toggleMic() {
      const btn = document.getElementById("micBtn");
      if (!recognition) recognition = initSpeech();
      if (!recognition) return;

      if (!isListening) {
        try {
          recognition.start();
          isListening = true;
          btn.classList.add("active");
          btn.innerText = "🛑 Stop Mic";
        } catch(e) {}
      } else {
        isListening = false;
        recognition.stop();
        btn.classList.remove("active");
        btn.innerText = "🎙️ Listen HR";
      }
    }

    // Load initial welcome prompt on open
    window.addEventListener("DOMContentLoaded", () => {
      submitQuickQuestion("Tell me about yourself and your background in Application Support.");
    });
  </script>
</body>
</html>
